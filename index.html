    &lt;!-- About Section --&gt;
    &lt;section id=&quot;sobre&quot;&gt;
        &lt;div class=&quot;container&quot;&gt;
            &lt;h2 class=&quot;section-title&quot;&gt;Excelência desde 2014&lt;/h2&gt;
            &lt;p class=&quot;section-subtitle&quot;&gt;Transformando espaços no Paraná e Santa Catarina com técnica, criatividade e compromisso absoluto com a qualidade&lt;/p&gt;
            
            &lt;div class=&quot;about-content&quot;&gt;
                &lt;div class=&quot;about-text&quot;&gt;
                    &lt;p&gt;A &lt;strong&gt;Noah Arquitetura&lt;/strong&gt; nasceu da paixão por criar espaços que transcendem o comum. Há mais de uma década, unimos expertise técnica e visão criativa para desenvolver projetos arquitetônicos que refletem a essência e os sonhos de cada cliente.&lt;/p&gt;
                    
                    &lt;p&gt;Nossa atuação vai além do projeto arquitetônico: somos especialistas em &lt;strong&gt;laudos técnicos e avaliações imobiliárias&lt;/strong&gt; conforme a NBR 14.653, oferecendo precisão, transparência e segurança jurídica em cada análise. Trabalhamos com embasamento técnico sólido para pessoas físicas, empresas e instituições financeiras.&lt;/p&gt;
                    
                    &lt;p&gt;Contamos com &lt;strong&gt;assessoria jurídica especializada em regularização imobiliária&lt;/strong&gt;, incluindo processos de usucapião, desde o levantamento técnico até o acompanhamento judicial completo. Garantimos agilidade, segurança e tranquilidade em cada etapa do processo.&lt;/p&gt;
                &lt;/div&gt;
                
                &lt;div class=&quot;about-text&quot;&gt;
                    &lt;p&gt;Cada projeto é único. Desenvolvemos soluções personalizadas que equilibram estética, funcionalidade e sustentabilidade, sempre respeitando o estilo de vida e as necessidades específicas de cada cliente.&lt;/p&gt;
                    
                    &lt;p&gt;Utilizamos as mais modernas tecnologias de &lt;strong&gt;modelagem 3D e renderização fotorrealística&lt;/strong&gt;, permitindo que você visualize seu projeto com riqueza de detalhes antes mesmo de iniciar a construção.&lt;/p&gt;
                    
                    &lt;p&gt;Nossa missão é criar espaços que inspiram, valorizam e melhoram a qualidade de vida. Porque acreditamos que arquitetura não é apenas construir – é transformar sonhos em experiências concretas e memoráveis.&lt;/p&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/section&gt;
