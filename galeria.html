<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Galeria | Noah Arquitetura</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f4f4;
}

.titulo{
  text-align:center;
  margin:50px 0 30px;
}

.galeria{
  max-width:1200px;
  margin:0 auto 80px;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.galeria img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="titulo">
  <h2>Arquitetura</h2>
  <p>Projetos desenvolvidos com funcionalidade, estética e conforto</p>
</div>

<div class="galeria">
  <img src="/images/ferrugem.jpg" alt="Projeto Ferrugem">
  <img src="/images/fortunato.jpg" alt="Projeto Fortunato">
  <img src="/images/dunas.jpg" alt="Projeto Dunas">
  <img src="/images/bosqueimbituba.jpg" alt="Projeto Bosque Imbituba">
  <img src="/images/cozinha.jpg" alt="Projeto Cozinha">
  <img src="/images/cozinhadunas.jpg" alt="Projeto Cozinha Dunas">
  <img src="/images/interior.jpeg" alt="Projeto Interior">
  <img src="/images/arquitetosnoah.jpeg" alt="Projeto Arquitetura">
</div>

</body>
</html>
