<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Arquitetura | Noah Arquitetura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Montserrat', sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#2c2c2c;
    }

    header{
      background:#fff;
      padding:30px 40px;
      max-width:1200px;
      margin:0 auto;
      display:flex;
      align-items:center;
      border-bottom:1px solid #ddd;
    }

    header h1 a{
      text-decoration:none;
      color:#2c2c2c;
      letter-spacing:2px;
      font-size:22px;
    }

    .titulo{
      max-width:1100px;
      margin:70px auto 40px;
      text-align:center;
      padding:0 20px;
    }

    .titulo h2{
      font-size:32px;
      font-weight:400;
    }

    .titulo p{
      margin-top:10px;
      color:#666;
    }

    .galeria{
      max-width:1200px;
      margin:0 auto 100px;
      padding:0 20px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .galeria img{
      width:100%;
      height:260px;
      object-fit:cover;
      border-radius:14px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      transition:0.4s;
      background:#eee;
    }

    .galeria img:hover{
      transform:scale(1.05);
    }

    footer{
      background:#1e1e1e;
      color:#fff;
      text-align:center;
      padding:30px;
      font-size:13px;
    }
  </style>
</head>

<body>

<header>
  <h1>
    <a href="/">NOAH ARQUITETURA</a>
  </h1>
</header>

<div class="titulo">
  <h2>Arquitetura</h2>
  <p>Projetos desenvolvidos com funcionalidade, estética e conforto</p>
</div>

<div class="galeria">
  <img src="/images/galeria/ferrugem.jpg" alt="Projeto Ferrugem">
  <img src="/images/galeria/predio1.jpg" alt="Projeto Prédio">
  <img src="/images/galeria/panoramico.jpg" alt="Projeto Panorâmico">
  <img src="/images/galeria/palhocinha.jpg" alt="Projeto Palhocinha">
  <img src="/images/galeria/fortunado.jpg" alt="Projeto Fortunado">
  <img src="/images/galeria/reforma.jpg" alt="Projeto Reforma">
  <img src="/images/galeria/dunas.jpg" alt="Projeto Dunas">
  <img src="/images/galeria/bosqueimbituba.jpg" alt="Projeto Bosque Imbituba">
  <img src="/images/galeria/sala.jpg" alt="Projeto Sala">
  <img src="/images/galeria/salabalcao.jpg" alt="Projeto Sala com Balcão">
  <img src="/images/galeria/cozinhadunas.jpg" alt="Projeto Cozinha Dunas">
  <img src="/images/galeria/cozinha.jpg" alt="Projeto Cozinha">
</div>

<footer>
  <p>© 2014 · Noah Arquitetura · Todos os direitos reservados</p>
</footer>

</body>
</html>
