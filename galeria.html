<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Galeria de Projetos | Noah Arquitetura</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat', sans-serif;
}

body{
  background:#f6f6f6;
  color:#2c2c2c;
}

/* HEADER */
header{
  background:#fff;
  padding:30px 40px;
  max-width:1200px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e0e0e0;
}

header h1{
  font-size:22px;
  letter-spacing:2px;
}

header h1 a{
  text-decoration:none;
  color:inherit;
}

nav a{
  margin-left:30px;
  text-decoration:none;
  color:#2c2c2c;
  font-size:14px;
}

nav a:hover{
  opacity:0.6;
}

/* TÍTULO */
.titulo-galeria{
  max-width:1100px;
  margin:70px auto 40px auto;
  text-align:center;
  padding:0 30px;
}

.titulo-galeria h2{
  font-size:32px;
  font-weight:400;
  margin-bottom:10px;
}

.titulo-galeria p{
  font-size:16px;
  color:#666;
}

/* GALERIA */
.galeria{
  max-width:1100px;
  margin:0 auto 80px auto;
  padding:0 30px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
  gap:25px;
}

.galeria img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
  transition:0.4s;
}

.galeria img:hover{
  transform:scale(1.03);
}

/* FOOTER */
footer{
  background:#1e1e1e;
  color:#fff;
  text-align:center;
  padding:30px;
  font-size:13px;
}

.redes a{
  font-size:26px;
  margin:0 10px;
  color:#fff;
  text-decoration:none;
}

.redes a:hover{
  color:#25D366;
}

.frase-fe{
  margin-top:12px;
  font-style:italic;
  font-size:13px;
  opacity:0.8;
}

/* MOBILE */
@media(max-width:768px){
  header{
    flex-direction:column;
    gap:20px;
  }

  .titulo-galeria h2{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header>
  <h1>
    <a href="index.html">NOAH ARQUITETURA</a>
  </h1>

  <nav>
    <a href="index.html#projetos">Projetos</a>
    <a href="index.html#sobre">Sobre Nós</a>
    <a href="index.html#contato">Contato</a>
  </nav>
</header>

<div class="titulo-galeria">
  <h2>Galeria de Projetos</h2>
  <p>Alguns dos trabalhos desenvolvidos pela Noah Arquitetura</p>
</div>

<div class="galeria">
  <!-- TROQUE AS IMAGENS PELOS SEUS ARQUIVOS -->
  <img src="images/galeria1.jpg" alt="Projeto 1">
  <img src="images/galeria2.jpg" alt="Projeto 2">
  <img src="images/galeria3.jpg" alt="Projeto 3">
  <img src="images/galeria4.jpg" alt="Projeto 4">
  <img src="images/galeria5.jpg" alt="Projeto 5">
  <img src="images/galeria6.jpg" alt="Projeto 6">
</div>

<footer>
  <div class="redes">
    <a href="https://www.instagram.com/noaharquitetura/" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>

    <a href="https://wa.me/5543996141663" target="_blank">
      <i class="fab fa-whatsapp"></i>
    </a>
  </div>

  <p>© 2014 · Noah Arquitetura · Todos os direitos reservados</p>

  <p class="frase-fe">
    "A Deus toda honra e toda glória."
  </p>
</footer>

</body>
</html>
