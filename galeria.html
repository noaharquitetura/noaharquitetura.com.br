<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Arquitetura de Interiores | Noah Arquitetura</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat', sans-serif;
}

body{
  background:#f4f4f4;
  color:#2c2c2c;
}

/* HEADER */
header{
  background:#fff;
  padding:30px 40px;
  max-width:1200px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

header h1 a{
  text-decoration:none;
  color:#2c2c2c;
  letter-spacing:2px;
  font-size:22px;
}

/* TÍTULO */
.titulo{
  max-width:1100px;
  margin:70px auto 40px auto;
  text-align:center;
  padding:0 20px;
}

.titulo h2{
  font-size:32px;
  font-weight:400;
}

.titulo p{
  margin-top:10px;
  color:#666;
}

/* GALERIA */
.galeria{
  max-width:1200px;
  margin:0 auto 100px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.galeria img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:0.4s;
}

.galeria img:hover{
  transform:scale(1.05);
}

/* FOOTER */
footer{
  background:#1e1e1e;
  color:#fff;
  text-align:center;
  padding:30px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>
    <a href="index.html">NOAH ARQUITETURA</a>
  </h1>
</header>

<div class="titulo">
  <h2>Arquitetura de Interiores</h2>
  <p>Projetos desenvolvidos com funcionalidade, estética e conforto</p>
</div>

<div class="galeria">
  <img src="images/galeria/foto1.jpg" alt="Projeto 1">
  <img src="images/galeria/foto2.jpg" alt="Projeto 2">
  <img src="images/galeria/foto3.jpg" alt="Projeto 3">
  <img src="images/galeria/foto4.jpg" alt="Projeto 4">
  <img src="images/galeria/foto5.jpg" alt="Projeto 5">
  <img src="images/galeria/foto6.jpg" alt="Projeto 6">
  <img src="images/galeria/foto7.jpg" alt="Projeto 7">
  <img src="images/galeria/foto8.jpg" alt="Projeto 8">
  <img src="images/galeria/foto9.jpg" alt="Projeto 9">
  <img src="images/galeria/foto10.jpg" alt="Projeto 10">
</div>

<footer>
  <p>© 2014 · Noah Arquitetura · Todos os direitos reservados</p>
</footer>

</body>
</html>
