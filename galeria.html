<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f4f4;
}

/* TÍTULO */
.titulo {
  text-align: center;
  margin: 50px 0 30px;
}

.titulo h2 {
  margin-bottom: 10px;
}

/* GALERIA DE FOTOS */
.galeria {
  max-width: 1200px;
  margin: 0 auto 80px;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.galeria img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 12px;
}

/* VÍDEOS */
.video-galeria {
  max-width: 1200px;
  margin: 0 auto 100px;
  padding: 0 20px;
  display: grid;
  gap: 40px;
}

.video-container {
  position: relative;
  padding-bottom: 56.25%; /* 16:9 */
  height: 0;
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  background: #000;
}

.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* FOOTER */
footer {
  background: #1e1e1e;
  color: #fff;
  text-align: center;
  padding: 40px 20px;
  font-size: 13px;
}

.redes {
  margin-bottom: 15px;
}

.redes a {
  color: #fff;
  font-size: 28px;
  margin: 0 12px;
  text-decoration: none;
}

.redes a:hover {
  color: #25D366;
}

.frase-fe {
  margin-top: 10px;
  font-style: italic;
  opacity: 0.7;
}
</style>
</head>
