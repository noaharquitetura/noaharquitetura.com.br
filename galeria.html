<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Galeria | Noah Arquitetura</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin:0;
  padding:0;
  height:auto !important;
  min-height:100%;
  overflow-y:auto !important;
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f4f4;
}

.titulo{
  text-align:center;
  margin:50px 0 30px;
}

.galeria{
  max-width:1200px;
  margin:0 auto 100px;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  height:auto !important;
  overflow:visible !important;
}

.galeria img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="titulo">
  <h2>Arquitetura</h2>
  <p>Projetos desenvolvidos com funcionalidade, estética e conforto</p>
</div>

<div class="galeria">
  <img src="/images/predio1.jpg">
  <img src="/images/ferrugem.jpg">
  <img src="/images/fortunato.jpg">
  <img src="/images/palhocinha.jpg">
  <img src="/images/bosqueimbituba.jpg">
  <img src="/images/dunas.jpg">
  <img src="/images/reforma.jpg">
  <img src="/images/cozinhadunas.jpg">
  <img src="/images/salabalcao.jpg">
  <img src="/images/cozinha.jpg">
</div>

</body>
</html>
